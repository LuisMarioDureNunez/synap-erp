version: '3.8'
services:
  postgres:
    image: postgres:16
    container_name: synap_db
    environment:
      POSTGRES_USER: synap_admin
      POSTGRES_PASSWORD: synap_secure_2025
      POSTGRES_DB: synap_db
    ports:
      - "5432:5432"
    volumes:
      - synap_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: synap_cache
    ports:
      - "6379:6379"

volumes:
  synap_pgdata:
