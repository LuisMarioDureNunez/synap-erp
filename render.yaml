services:
  - type: web
    name: synap-backend
    env: node
    region: oregon
    buildCommand: cd server && npm install && npm run build
    startCommand: cd server && node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DB_HOST
        fromDatabase:
          name: synap-db
          property: host
      - key: DB_PORT
        fromDatabase:
          name: synap-db
          property: port
      - key: DB_NAME
        fromDatabase:
          name: synap-db
          property: database
      - key: DB_USER
        fromDatabase:
          name: synap-db
          property: user
      - key: DB_PASSWORD
        fromDatabase:
          name: synap-db
          property: password
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 24h
      - key: JWT_REFRESH_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://systemaposlmtn.netlify.app

databases:
  - name: synap-db
    databaseName: synap_db
    user: synap_admin
    plan: free
